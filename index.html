<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Certificate Verification</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f7f8fc, #e8eef7);
      color: #202124;
    }

    .box {
      width: 90%;
      max-width: 420px;
      padding: 35px 25px;
      text-align: center;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(20, 30, 60, 0.16);
      animation: pop 0.4s ease-out;
    }

    .loader {
      width: 70px;
      height: 70px;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 6px solid #f1d9da;
      border-top-color: #7b1113;
      animation: spin 0.9s linear infinite;
    }

    h2 {
      margin: 0 0 8px;
      color: #7b1113;
      font-size: 24px;
    }

    p {
      margin: 0;
      color: #5f6368;
      font-size: 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(0.94) translateY(10px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="loader"></div>
    <h2>Verifying Certificate</h2>
    <p>Please wait while we check the official record...</p>
  </div>

  <script>
    const scriptUrl = "https://script.google.com/macros/s/AKfycbzo0OcpOzTHy7hQ7eTEpT6IuHHFuU1L5UGeY2c8I1nJILNJLCMf0nQuGScdaotd9Nrb/exec";

    setTimeout(function () {
      window.location.href = scriptUrl + window.location.search;
    }, 1000);
  </script>
</body>
</html>
