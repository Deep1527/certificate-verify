<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Certificate Verification</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(123, 17, 19, 0.12), transparent 32%),
        linear-gradient(135deg, #f7f8fc, #e8eef7);
      color: #202124;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 42px 28px;
      text-align: center;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(123, 17, 19, 0.12);
      border-radius: 18px;
      box-shadow: 0 22px 60px rgba(20, 30, 60, 0.18);
      animation: cardIn 0.45s ease-out both;
    }

    .logo-wrap {
      width: 92px;
      height: 92px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: white;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.16);
      position: relative;
    }

    .logo-wrap::before {
      content: "";
      position: absolute;
      inset: -7px;
      border-radius: 50%;
      border: 3px solid rgba(123, 17, 19, 0.14);
      border-top-color: #7b1113;
      animation: spin 1s linear infinite;
    }

    .logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border-radius: 50%;
      position: relative;
      z-index: 1;
    }

    .status {
      display: inline-block;
      margin-bottom: 14px;
      padding: 7px 14px;
      border-radius: 999px;
      background: #f9e7e8;
      color: #7b1113;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    h1 {
      margin: 0 0 10px;
      color: #7b1113;
      font-size: 30px;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: #5f6368;
      font-size: 16px;
      line-height: 1.5;
    }

    .progress {
      height: 8px;
      width: 100%;
      max-width: 330px;
      margin: 26px auto 0;
      background: #eef1f6;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 45%;
      border-radius: 999px;
      background: linear-gradient(90deg, #7b1113, #c83b40);
      animation: loading 1.1s ease-in-out infinite;
    }

    .secure {
      margin-top: 18px;
      color: #6b7280;
      font-size: 13px;
      font-weight: 600;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes loading {
      0% {
        transform: translateX(-120%);
      }

      50% {
        transform: translateX(65%);
      }

      100% {
        transform: translateX(240%);
      }
    }

    @media (max-width: 520px) {
      .card {
        padding: 34px 20px;
      }

      h1 {
        font-size: 25px;
      }

      p {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo-wrap">
      <img
        class="logo"
        src="https://drive.google.com/thumbnail?id=1qLY86eGTz4Rj7sjLwsbYOVX-DsEEcXtp&sz=w300"
        alt="Mahakaal Institute Logo"
      >
    </div>

    <div class="status">Secure Verification</div>

    <h1>Verifying Certificate</h1>
    <p>Please wait while we connect to the official student record.</p>

    <div class="progress">
      <div class="bar"></div>
    </div>

    <div class="secure">Mahakaal Institute Certificate Portal</div>
  </main>

  <script>
    const scriptUrl = "https://script.google.com/macros/s/AKfycbzo0OcpOzTHy7hQ7eTEpT6IuHHFuU1L5UGeY2c8I1nJILNJLCMf0nQuGScdaotd9Nrb/exec";

    setTimeout(function () {
      window.location.href = scriptUrl + window.location.search;
    }, 1200);
  </script>
</body>
</html>
